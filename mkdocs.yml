site_name: Rheic Sandboxes
site_url: https://rheic.github.io/sandboxes/
site_description: Evidence-led documentation for the Rheic Sandboxes alpha and its Docker sbx compatibility.
site_dir: site
docs_dir: docs
copyright: Copyright © 2026 Rheic contributors
nav:
  - Overview: en/index.md
  - Get started: en/quickstart.md
  - Docker sbx comparison: en/comparison.md
  - CLI: en/cli.md
  - Native runtime: en/runtime.md
  - Security and limits: en/limits.md
plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      fallback_to_default: false
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ru
          name: Русский
          build: true
          nav:
            - Обзор: ru/index.md
            - Начало работы: ru/quickstart.md
            - Сравнение с Docker sbx: ru/comparison.md
            - CLI: ru/cli.md
            - Нативный runtime: ru/runtime.md
            - Безопасность и ограничения: ru/limits.md
theme:
  name: material
  custom_dir: overrides
  logo: assets/rheic-shark.png
  favicon: assets/rheic-mark.svg
  font: false
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/rheic.css?v=2
extra_javascript:
  - assets/reveal.js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
