site_name: Sandboxes by Gyrel
site_url: https://gyrel.github.io/sandboxes/
site_description: Sandboxes, the Gyrel alpha. Install the released CLI and daemon, boot real microVMs on macOS ARM64, and review guides, runtime boundaries, and command reference.
site_dir: site

docs_dir: docs

copyright: Copyright © 2026 Gyrel contributors

nav:
  - Start here:
      - Overview: en/index.md
      - System requirements: en/requirements.md
      - Quick start: en/quickstart.md
  - Build:
      - Agents: en/agents.md
      - Workspaces and files: en/workspaces.md
      - Network and ports: en/networking.md
      - Credentials and sign-in: en/credentials.md
      - Kits: en/kits.md
  - Operate:
      - User cases: en/user-cases.md
      - Docker: en/docker.md
      - Terminal dashboard: en/tui.md
      - Troubleshooting: en/troubleshooting.md
      - Alpha testing guide: en/alpha-testing.md
  - Reference:
      - CLI: en/cli.md
      - Settings: en/settings.md
      - Architecture: en/architecture.md
      - OpenCode: en/opencode.md
      - Security: en/security.md
      - FAQ: en/faq.md

plugins:
  - search:
      lang:
        - en
        - ru
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      fallback_to_default: false
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: Sandboxes by Gyrel
          site_description: Sandboxes, the Gyrel alpha. Install the released CLI and daemon, boot real microVMs on macOS ARM64, and review guides, runtime boundaries, and command reference.
        - locale: ru
          name: Русский
          build: true
          site_name: Sandboxes by Gyrel
          site_description: "Sandboxes, альфа-версия Gyrel: установите выпущенные CLI и daemon, запустите microVM на macOS ARM64, изучите руководства, границы runtime и справочник команд."
          nav:
            - Начать:
                - Обзор: ru/index.md
                - Системные требования: ru/requirements.md
                - Быстрый старт: ru/quickstart.md
            - Настроить:
                - Агенты: ru/agents.md
                - Workspace и файлы: ru/workspaces.md
                - Сеть и порты: ru/networking.md
                - Credentials и вход: ru/credentials.md
                - Kits: ru/kits.md
            - Использовать:
                - Пользовательские кейсы: ru/user-cases.md
                - Docker: ru/docker.md
                - Терминальная панель: ru/tui.md
                - Решение проблем: ru/troubleshooting.md
                - Гайд альфа-тестировщика: ru/alpha-testing.md
            - Справочник:
                - CLI: ru/cli.md
                - Настройки: ru/settings.md
                - Архитектура: ru/architecture.md
                - OpenCode: ru/opencode.md
                - Безопасность: ru/security.md
                - Частые вопросы: ru/faq.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/gyrel-black-sun.svg
  favicon: assets/gyrel-mark.svg
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/gyrel.css?v=10

extra_javascript:
  - assets/search.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
